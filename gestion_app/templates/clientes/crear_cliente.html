{% extends "base.html" %}

{% block content %}
<div class="container mb-5" style="margin-top: 90px;"> <!-- separa del nav -->
    <div class="card shadow-sm mx-auto" style="max-width: 800px;">
        <div class="card-header bg-rosa text-white text-center">
            <h5 class="mb-0 text-center"">Crear Nuevo Cliente</h5>
        </div>
        <div class="card-body">
            <form method="post" novalidate>
                {% csrf_token %}

                <div class="row g-2">
                    {% for field in form %}
                        <div class="col-12 col-md-6">
                            {{ field.label_tag }}
                            {{ field }}
                            {% if field.help_text %}
                                <small class="form-text text-muted">{{ field.help_text }}</small>
                            {% endif %}
                            {% for error in field.errors %}
                                <div class="text-danger">{{ error }}</div>
                            {% endfor %}
                        </div>
                    {% endfor %}
                </div>

                <div class="d-flex justify-content-center mt-3 gap-2 flex-wrap">
                    <button type="submit" class="btn btn-success btn-sm">
                        <i class="bi bi-check-circle me-1"></i> Guardar
                    </button>
                    <a href="{% url 'cliente_list' %}" class="btn btn-secondary btn-sm">
                        <i class="bi bi-x-circle me-1"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
